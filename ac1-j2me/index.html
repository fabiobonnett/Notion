<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { position: relative; height: 100%; }
  .carrusel {
    display: flex; height: 100%; overflow-x: auto;
    scroll-snap-type: x mandatory; scroll-behavior: smooth; gap: 8px;
  }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel img {
    flex: 0 0 100%; width: 100%; height: 100%;
    object-fit: contain; scroll-snap-align: center; border-radius: 12px;
  }
  .btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.5); color: #fff; font-size: 20px; cursor: pointer;
  }
  .prev { left: 8px; } .next { right: 8px; }
  .dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(0,0,0,.35); box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  .dot.on { background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
</style>
</head>
