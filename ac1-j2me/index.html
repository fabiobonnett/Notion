<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { display: flex; align-items: center; gap: 6px; height: 100%; }
  .carrusel {
    flex: 1; min-width: 0; height: 100%;
    display: flex; gap: 8px; overflow-x: auto;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
  }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel img {
    flex: 0 0 calc((100% - (var(--n) - 1) * 8px) / var(--n));
    min-width: 0; height: 100%;
    object-fit: contain; scroll-snap-align: start; border-radius: 12px;
    cursor: zoom-in;
  }
  .btn {
    flex: 0 0 auto; width: 36px; height: 36px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.5); color: #fff; font-size: 20px; cursor: pointer;
  }
  .visor {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; overflow: hidden;
    background: rgba(0,0,0,.92);
  }
  .visor.abierto { display: flex; }
  .visor img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    touch-action: none; user-select: none; -webkit-user-drag: none;
    cursor: zoom-in;
  }
  .cerrar {
    position: absolute; top: 12px; right: 12px; z-index: 11;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.2); color: #fff; font-size: 22px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <button class="btn prev">‹</button>
  <div class="carrusel">
    <img src="AC1_J2ME-1.png">
    <img src="AC1_J2ME-2.png">
    <img src="AC1_J2ME-3.png">
    <img src="AC1_J2ME-4.png">
    <img src="AC1_J2ME-5.png">
  </div>
  <button class="btn next">›</button>
</div>

<div class="visor">
  <button class="cerrar">✕</button>
  <img draggable="false">
</div>

<script>
  const VISIBLES_PC = 5;
  const VISIBLES_MOVIL = 3;
  const c = document.querySelector('.carrusel');
  const prev = document.querySelector('.prev');
  const next = document.querySelector('.next');
  const visor = document.querySelector('.visor');
  const visorImg = visor.querySelector('img');

  function ajustar() {
    const n = window.innerWidth < 600 ? VISIBLES_MOVIL : VISIBLES_PC;
    document.documentElement.style.setProperty('--n', n);
    const caben = c.scrollWidth <= c.clientWidth + 1;
    prev.hidden = next.hidden = caben;
  }
  window.addEventListener('resize', ajustar);
  window.addEventListener('load', ajustar);
  ajustar();

  prev.onclick = () => c.scrollBy({ left: -c.clientWidth });
  next.onclick = () => c.scrollBy({ left: c.clientWidth });

  // ---- Zoom ----
  let s = 1, x = 0, y = 0;
  const aplicar = () => {
    visorImg.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    visorImg.style.cursor = s > 1 ? 'grab' : 'zoom-in';
  };
  const reset = () => { s = 1; x = 0; y = 0; aplicar(); };
  const zoom = f => {
    s = Math.min(6, Math.max(1, s * f));
    if (s === 1) { x = 0; y = 0; }
    aplicar();
  };

  visor.addEventListener('wheel', e => {
    e.preventDefault();
    zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  visorImg.addEventListener('dblclick', () => {
    if (s > 1) reset(); else { s = 2.5; aplicar(); }
  });

  // Arrastrar (1 puntero) y pellizcar (2 punteros)
  const punteros = new Map();
  let dist0 = 0, s0 = 1;
  visorImg.addEventListener('pointerdown', e => {
    visorImg.setPointerCapture(e.pointerId);
    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (punteros.size === 2) {
      const [a, b] = [...punteros.values()];
      dist0 = Math.hypot(a.x - b.x, a.y - b.y);
      s0 = s;
    }
  });
  visorImg.addEventListener('pointermove', e => {
    if (!punteros.has(e.pointerId)) return;
    const p = punteros.get(e.pointerId);
    if (punteros.size === 2) {
      punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const [a, b] = [...punteros.values()];
      s = Math.min(6, Math.max(1, s0 * Math.hypot(a.x - b.x, a.y - b.y) / dist0));
      if (s === 1) { x = 0; y = 0; }
      aplicar();
    } else if (s > 1) {
      x += e.clientX - p.x;
      y += e.clientY - p.y;
      punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
      aplicar();
    }
  });
  const soltar = e => punteros.delete(e.pointerId);
  visorImg.addEventListener('pointerup', soltar);
  visorImg.addEventListener('pointercancel', soltar);

  // ---- Abrir / cerrar ----
  c.querySelectorAll('img').forEach(img => {
    img.onclick = () => {
      visorImg.src = img.src;
      reset();
      visor.classList.add('abierto');
      if (visor.requestFullscreen) visor.requestFullscreen().catch(() => {});
    };
  });

  function cerrar() {
    visor.classList.remove('abierto');
    if (document.fullscreenElement) document.exitFullscreen();
  }
  visor.addEventListener('click', e => { if (e.target === visor) cerrar(); });
  visor.querySelector('.cerrar').onclick = cerrar;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) visor.classList.remove('abierto');
  });
</script>
</body>
</html>
