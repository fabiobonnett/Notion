<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  .wrap { display: flex; align-items: center; gap: 4px; height: 100%; }
  .carrusel {
    flex: 1; min-width: 0; height: 100%;
    display: flex; align-items: center; justify-content: center; gap: 8px; overflow-x: auto;
    scroll-snap-type: x mandatory; scroll-behavior: smooth;
  }
  .carrusel::-webkit-scrollbar { display: none; }
  .carrusel img {
    flex: 0 0 auto; width: auto; height: 100%;   /* la altura exacta la fija el script */
    scroll-snap-align: start; border-radius: 12px;
    cursor: zoom-in;
  }
  .carrusel img.rota {           /* imagen que no se encontró */
    width: 120px; background: #eee; color: #c00; font: 12px sans-serif;
  }
  .btn {
    flex: 0 0 auto; width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: rgba(0,0,0,.5); color: #fff; font-size: 16px; line-height: 1; cursor: pointer;
  }

  /* Zoom temporal sobre la miniatura, con el resto oscurecido */
  .lupa {
    position: fixed; inset: 0; z-index: 5; display: none; overflow: hidden;
    background: rgba(0,0,0,0);
  }
  .lupa.abierta { display: block; }
  .lupa img {
    position: absolute; object-fit: contain; border-radius: 12px;
    user-select: none; -webkit-user-drag: none;
    transform-origin: 50% 50%; will-change: transform;
  }

  /* Pantalla completa */
  .visor {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; overflow: hidden;
    background: rgba(0,0,0,.92);
  }
  .visor.abierto { display: flex; }
  .visor img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    touch-action: none; user-select: none; -webkit-user-drag: none;
    transform-origin: 50% 50%; cursor: zoom-in;
  }
  .cerrar {
    position: absolute; top: 12px; right: 12px; z-index: 11;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(255,255,255,.2); color: #fff; font-size: 22px; cursor: pointer;
  }

  /* Aviso de errores (solo aparece si algo falla) */
  .aviso {
    position: fixed; left: 8px; bottom: 8px; z-index: 20; max-width: 90%;
    background: #c00; color: #fff; font: 12px/1.4 sans-serif;
    padding: 6px 10px; border-radius: 6px; display: none;
  }
</style>
</head>
