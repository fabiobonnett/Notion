<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assassin’s Creed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#EEF0F5;--surface:#FFFFFF;--ink:#1C2233;--muted:#5B6478;--line:#CDD3E0;--soft:#E3E7F0;--game:#3B5BDB;--film:#C2255C;--comic:#D9480F;--book:#2B8A3E;--series:#7048E8;--other:#5C677D;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161A26;--surface:#1F2433;--ink:#E6E9F2;--muted:#9AA3B8;--line:#333A4D;--soft:#282E40;--game:#748FFC;--film:#F06595;--comic:#FF8A3D;--book:#51CF66;--series:#9775FA;--other:#ADB5BD;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161A26;--surface:#1F2433;--ink:#E6E9F2;--muted:#9AA3B8;--line:#333A4D;--soft:#282E40;--game:#748FFC;--film:#F06595;--comic:#FF8A3D;--book:#51CF66;--series:#9775FA;--other:#ADB5BD;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible{outline:2px solid var(--game);outline-offset:2px}
.tl-wrap{max-width:880px;margin:0 auto;padding:32px 20px 48px}
.tl-head h1{font:600 clamp(34px,6vw,56px)/.95 'Barlow Condensed','Arial Narrow',sans-serif;margin:0}
.tl-head p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.tl-head .tl-sum{font-size:14px;margin-top:8px}
.tl-controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:22px 0 30px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px 'Barlow',sans-serif;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 14px 'Barlow',sans-serif;padding:5px 11px 5px 9px;border-radius:999px;cursor:pointer}
.chip svg{width:15px;height:15px;color:var(--c,var(--muted))}
.chip span{color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.tl-list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:84px 30px minmax(0,1fr);column-gap:14px;padding-bottom:22px}
.year{text-align:right;font:600 32px/1 'Barlow Condensed','Arial Narrow',sans-serif;padding-top:3px;font-variant-numeric:tabular-nums}
.year small{display:block;font-size:18px;font-weight:500;color:var(--muted);margin-top:3px}
.year.long{font-size:19px;line-height:1.1;padding-top:7px;overflow-wrap:anywhere}
.spine{position:relative;display:flex;justify-content:center}
.spine::before{content:'';position:absolute;left:50%;top:0;bottom:-22px;width:2px;margin-left:-1px;background:var(--line)}
.item:first-child .spine::before{top:16px}
.item:last-child .spine::before{display:none}
.marker{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.marker svg{width:16px;height:16px}
.card{display:flex;min-width:0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;overflow:hidden}
.card.land{flex-direction:column}
.media{position:relative;flex:0 0 150px;aspect-ratio:3/4;background:var(--soft);overflow:hidden;align-self:flex-start}
.card.land .media{flex:none;width:100%;aspect-ratio:16/9}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.media img.on{opacity:1}.media img.broken{display:none}
.media.empty::after{content:'Imagen no disponible';position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted);text-align:center;padding:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,20,35,.62);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.prev{left:6px}.next{right:6px}
.count{position:absolute;bottom:6px;right:6px;background:rgba(15,20,35,.62);color:#fff;font-size:12px;padding:1px 7px;border-radius:999px}
.body{padding:14px 16px 16px;min-width:0;flex:1}
.kind{margin:0;font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 12px}
.kind b{color:var(--c);font-weight:600}.kind span{color:var(--muted)}
.body h3{margin:4px 0 0;font-size:20px;line-height:1.25;font-weight:600}
.body h3 a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.body h3 a:hover{text-decoration-color:var(--c)}
.facts{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
.plats{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0;padding:0;list-style:none}
.plats li{font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--soft)}
.notes{margin:10px 0 0;font-size:15px;line-height:1.55;white-space:pre-line;max-width:65ch}
.empty-tl{padding:40px 0;color:var(--muted)}
@media (max-width:560px){.tl-wrap{padding:22px 14px 36px}.item{grid-template-columns:54px 30px minmax(0,1fr);column-gap:10px}.year{font-size:23px}.year small{font-size:14px}.year.long{font-size:14px}.card{flex-direction:column}.media,.card.land .media{flex:none;width:100%;aspect-ratio:auto;height:220px;align-self:stretch}.media img{object-fit:contain}}
@media (prefers-reduced-motion:reduce){.media img{transition:none}}</style>
</head>

  var orders=(D.orders&&D.orders.length)?D.orders:[{id:'_all',name:'',sequence:[]}];
  function findOrder(id){for(var i=0;i<orders.length;i++){if(orders[i].id===id)return orders[i];}return null;}
  var st={orderId:orders[0].id,filter:''};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function ico(t){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICONS[t]+'"/></svg>';}
  function tp(e){return TYPES[e.type]?e.type:'other';}
  function res(s){
    s=String(s||'').trim(); if(!s) return '';
    var gh=s.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/i);
    if(gh) return 'https://raw.githubusercontent.com/'+gh[1]+'/'+gh[2]+'/'+gh[3];
    if(/^(https?:)?\/\//i.test(s)||/^data:/i.test(s)) return s;
    var b=String(D.imgBase||'').trim().replace(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:tree|blob)\//i,'https://raw.githubusercontent.com/$1/$2/');
    var f=String(D.imgFolder||'').trim().replace(/^\/+/,'');
    if(b&&b.slice(-1)!=='/') b+='/'; if(f&&f.slice(-1)!=='/') f+='/';
    var p=f+s.replace(/^\/+/,'');
    try{p=encodeURI(decodeURI(p));}catch(x){p=encodeURI(p);}
    return b+p;
  }
  function plural(n,a,b){return n+' '+(n===1?a:b);}
  function range(e){
    if(e.yearStart==null||e.yearStart==='') return null;
    var end=e.ongoing?'presente':(e.yearEnd&&+e.yearEnd!==+e.yearStart?e.yearEnd:'');
    return {a:e.yearStart,b:end};
  }
  function facts(e){
    var f=[];
    if(e.type==='comic'){if(e.comicType)f.push(e.comicType);if(e.issues)f.push(plural(+e.issues,'número','números'));}
    if(e.type==='series'){if(e.seasons)f.push(plural(+e.seasons,'temporada','temporadas'));if(e.episodes)f.push(plural(+e.episodes,'episodio','episodios'));}
    if(e.type==='book'&&e.author)f.push('Por '+e.author);
    return f.join(', ');
  }
  function item(e){
    var t=tp(e),r=range(e),sub=[];
    var y=r?esc(r.a)+(r.b?'<small>–'+esc(r.b)+'</small>':''):'<small>Sin año</small>';
    if(e.storyYear) sub.push('Ambientado en '+esc(e.storyYear));
    var imgs=(e.images||[]).map(res).filter(Boolean),media='';
    if(imgs.length){
      media='<div class="media">'+imgs.map(function(u,i){return '<img src="'+esc(u)+'" alt="'+esc(e.title)+(imgs.length>1?' – imagen '+(i+1):'')+'"'+(i===0?' class="on"':'')+'>';}).join('')+
        (imgs.length>1?'<button class="nav prev" type="button" aria-label="Imagen anterior">‹</button><button class="nav next" type="button" aria-label="Imagen siguiente">›</button><span class="count">1/'+imgs.length+'</span>':'')+'</div>';
    }
    var title=esc(e.title||'Sin título');
    if(e.link&&/^https?:\/\//i.test(e.link)) title='<a href="'+esc(e.link)+'" target="_blank" rel="noopener">'+title+'</a>';
    var fx=facts(e);
    var plats=(t==='game'&&e.platforms&&e.platforms.length)?'<ul class="plats" aria-label="Plataformas">'+e.platforms.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>':'';
    var notes=e.notes?'<p class="notes">'+esc(e.notes)+'</p>':'';
    return '<li class="item" style="--c:var(--'+t+')"><div class="year">'+y+'</div>'+
      '<div class="spine"><span class="marker" title="'+TYPES[t][0]+'">'+ico(t)+'</span></div>'+
      '<article class="card'+(D.imgShape==='landscape'?' land':'')+'">'+media+'<div class="body">'+
      '<p class="kind"><b>'+TYPES[t][0]+'</b>'+sub.map(function(x){return '<span>'+x+'</span>';}).join('')+'</p>'+
      '<h3>'+title+'</h3>'+(fx?'<p class="facts">'+esc(fx)+'</p>':'')+plats+notes+'</div></article></li>';
  }
  function render(){
    var byId={}; (D.entries||[]).forEach(function(e){byId[e.id]=e;});
    var all=(D.entries||[]).map(function(e,i){var o={};for(var k in e)o[k]=e[k];o._i=i;return o;});
    var counts={};all.forEach(function(e){var t=tp(e);counts[t]=(counts[t]||0)+1;});
    var present=ORDER.filter(function(t){return counts[t];});
    if(st.filter&&!counts[st.filter]) st.filter='';
    var ord=findOrder(st.orderId)||orders[0];
    var seen={},seq=[];
    (ord.sequence||[]).forEach(function(id){var e=byId[id];if(e&&!seen[id]){seen[id]=1;seq.push(e);}});
    all.forEach(function(e){if(!seen[e.id]){seen[e.id]=1;seq.push(e);}});
    var shown=seq.filter(function(e){return !st.filter||tp(e)===st.filter;});
    var h='';
    if(D.title||D.subtitle||all.length){
      h+='<header class="tl-head">'+(D.title?'<h1>'+esc(D.title)+'</h1>':'')+(D.subtitle?'<p>'+esc(D.subtitle)+'</p>':'');
      if(all.length) h+='<p class="tl-sum">'+plural(all.length,'entrada','entradas')+(present.length>1?': '+present.map(function(t){return plural(counts[t],TYPES[t][1],TYPES[t][2]);}).join(', '):'')+'</p>';
      h+='</header>';
    }
    var c='';
    if(orders.length>1) c+='<div class="seg" role="group" aria-label="Elegir orden">'+orders.map(function(o){return '<button type="button" data-o="'+esc(o.id)+'" aria-pressed="'+(o.id===ord.id)+'">'+esc(o.name||'Sin nombre')+'</button>';}).join('')+'</div>';
    if(D.showFilters!==false&&present.length>1) c+='<div class="chips" role="group" aria-label="Filtrar por tipo"><button type="button" class="chip" data-f="" aria-pressed="'+(!st.filter)+'">Todo</button>'+present.map(function(t){return '<button type="button" class="chip" data-f="'+t+'" style="--c:var(--'+t+')" aria-pressed="'+(st.filter===t)+'">'+ico(t)+TYPES[t][3]+' <span>'+counts[t]+'</span></button>';}).join('')+'</div>';
    if(c) h+='<div class="tl-controls">'+c+'</div>';
    h+=shown.length?'<ol class="tl-list">'+shown.map(item).join('')+'</ol>':'<p class="empty-tl">Esta cronología aún no tiene entradas.</p>';
    root.innerHTML=h;
  }
  root.addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;
    if(b.dataset.o){st.orderId=b.dataset.o;render();return;}
    if(b.hasAttribute('data-f')){var f=b.dataset.f;st.filter=(!f||st.filter===f)?'':f;render();return;}
    if(b.classList.contains('nav')){
      var m=b.closest('.media'),ims=[].slice.call(m.querySelectorAll('img:not(.broken)'));if(!ims.length)return;
      var cur=ims.findIndex(function(i){return i.classList.contains('on');});if(cur<0)cur=0;
      ims[cur].classList.remove('on');cur=(cur+(b.classList.contains('next')?1:-1)+ims.length)%ims.length;ims[cur].classList.add('on');
      var cn=m.querySelector('.count');if(cn)cn.textContent=(cur+1)+'/'+ims.length;
    }
  });
  root.addEventListener('error',function(ev){
    var im=ev.target;if(!im||im.tagName!=='IMG')return;
    im.classList.add('broken');var m=im.closest('.media');if(!m)return;
    var ok=m.querySelectorAll('img:not(.broken)');
    if(!ok.length){m.classList.add('empty');[].forEach.call(m.querySelectorAll('.nav,.count'),function(n){n.remove();});return;}
    if(im.classList.contains('on')){im.classList.remove('on');ok[0].classList.add('on');}
    var cn=m.querySelector('.count');if(cn)cn.textContent='1/'+ok.length;
    if(ok.length===1)[].forEach.call(m.querySelectorAll('.nav,.count'),function(n){n.remove();});
  },true);
  render();
})(JSON.parse(document.getElementById('tl-data').textContent));</script>
</body>
</html>
