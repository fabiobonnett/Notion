<style>:root{--bg:#EEF0F5;--surface:#FFFFFF;--ink:#1C2233;--muted:#5B6478;--line:#CDD3E0;--soft:#E3E7F0;--game:#3B5BDB;--film:#2B8A3E;--comic:#E03131;--book:#D69E00;--series:#7048E8;--other:#5C677D;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161A26;--surface:#1F2433;--ink:#E6E9F2;--muted:#9AA3B8;--line:#333A4D;--soft:#282E40;--game:#748FFC;--film:#51CF66;--comic:#FF6B6B;--book:#FCC419;--series:#9775FA;--other:#ADB5BD;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161A26;--surface:#1F2433;--ink:#E6E9F2;--muted:#9AA3B8;--line:#333A4D;--soft:#282E40;--game:#748FFC;--film:#51CF66;--comic:#FF6B6B;--book:#FCC419;--series:#9775FA;--other:#ADB5BD;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible{outline:2px solid var(--game);outline-offset:2px}
.tl-wrap{max-width:880px;margin:0 auto;padding:32px 20px 48px}
.tl-head h1{font:600 clamp(34px,6vw,56px)/.95 'Barlow Condensed','Arial Narrow',sans-serif;margin:0;display:flex;align-items:center;gap:.28em}
.tl-icon{flex:none;height:1em;width:auto;max-width:1.8em;object-fit:contain;border-radius:6px}
.tl-emoji{font-size:.82em;line-height:1;height:auto}
.tl-head p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.tl-head .tl-sum{font-size:14px;margin-top:8px}
.tl-controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:22px 0 30px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 14px 'Barlow',sans-serif;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 14px 'Barlow',sans-serif;padding:5px 11px 5px 9px;border-radius:999px;cursor:pointer}
.chip svg{width:15px;height:15px;color:var(--c,var(--muted))}
.chip span{color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.badge{font-style:normal;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--m);background:color-mix(in srgb,var(--m) 13%,transparent);border:1px solid color-mix(in srgb,var(--m) 45%,transparent);padding:0 7px;border-radius:999px;line-height:1.7;align-self:center}
.alts{display:inline-flex;flex-wrap:wrap;background:var(--soft);border-radius:7px;padding:2px;margin:0 0 8px}
.alts button{border:0;background:transparent;color:var(--muted);font:500 13px 'Barlow',sans-serif;padding:4px 10px;border-radius:5px;cursor:pointer}
.alts button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,60,.15)}
.alts button{display:inline-flex;align-items:center;gap:5px}
.alts button svg{width:13px;height:13px;color:var(--c);flex:none}
.alts-l{align-self:center;font-size:12px;font-style:italic;color:var(--muted);padding:0 6px}
.pof.adp svg{width:13px;height:13px;color:var(--c);flex:none;margin-left:3px}
.pof.adp img+svg{margin-left:0}
.pof.adp b{font-weight:600;color:var(--ink)}
.mchip i{width:9px;height:9px;border-radius:50%;background:var(--m);display:inline-block}
.mchip.only{border-color:var(--m);background:color-mix(in srgb,var(--m) 14%,transparent)}
.mchip.hide{border-style:dashed;color:var(--muted);text-decoration:line-through}
.tagsel{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.tagsel select{font:500 14px 'Barlow',sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:240px}
.tl-list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:84px 30px minmax(0,1fr);column-gap:14px;padding-bottom:22px}
.year{text-align:right;font:600 32px/1 'Barlow Condensed','Arial Narrow',sans-serif;padding-top:3px;font-variant-numeric:tabular-nums}
.year small{display:block;font-size:18px;font-weight:500;color:var(--muted);margin-top:3px}
.year.long{font-size:19px;line-height:1.1;padding-top:7px;overflow-wrap:anywhere}
.spine{position:relative;display:flex;justify-content:center}
.spine::before{content:'';position:absolute;left:50%;top:0;bottom:-22px;width:2px;margin-left:-1px;background:var(--line)}
.item:first-child .spine::before{top:16px}
.item:last-child .spine::before{display:none}
.marker{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.marker svg{width:16px;height:16px}
.card{display:flex;min-width:0;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;overflow:hidden}
.card.land{flex-direction:column}
.media{position:relative;flex:0 0 160px;display:grid;align-items:center;justify-items:center;background:var(--soft);overflow:hidden;align-self:stretch;min-height:60px;isolation:isolate}
.media::before{content:'';position:absolute;inset:-24px;background:var(--bgimg,none) center/cover no-repeat;filter:blur(20px) saturate(1.1) brightness(.8);z-index:0;pointer-events:none}
.media.fill::before,.media.empty::before{display:none}
.card.land .media{flex:none;width:100%;align-self:stretch}
.media img{grid-area:1/1;display:block;width:100%;height:auto;max-height:440px;object-fit:contain;opacity:0;transition:opacity .25s;position:relative;z-index:1}
.media .nav,.media .count{z-index:2}
.card.land .media img{max-height:380px}
.media img.on{opacity:1}.media img.broken{display:none}.media img.fb:not(.on){display:none}
.media.empty{min-height:130px}
.media.empty::after{content:'Imagen no disponible';grid-area:1/1;font-size:13px;color:var(--muted);text-align:center;padding:8px}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,20,35,.62);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.prev{left:6px}.next{right:6px}
.count{position:absolute;bottom:6px;right:6px;background:rgba(15,20,35,.62);color:#fff;font-size:12px;padding:1px 7px;border-radius:999px}
.body{padding:14px 16px 16px;min-width:0;flex:1}
.kind{margin:0;font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 12px}
.kind b{color:var(--c);font-weight:600}.kind span{color:var(--muted)}
.pof{display:inline-flex;align-items:center;gap:7px;font-style:normal;background:var(--soft);border-radius:8px;padding:3px 10px 3px 3px;line-height:1.35;vertical-align:middle;max-width:100%}
.pof img{display:block;height:24px;width:18px;object-fit:cover;border-radius:4px;flex:none}
.pof img.broken{display:none}
.body h3{margin:4px 0 0;font-size:20px;line-height:1.25;font-weight:600}
.body h3 a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.body h3 a:hover{text-decoration-color:var(--c)}
.facts{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
.inu{margin:3px 0 0;font-size:15px;font-weight:600;color:var(--c)}
.rels{margin:7px 0 0;display:flex;flex-wrap:wrap;gap:6px;font-size:13.5px;color:var(--muted)}
.fsw{min-width:0}.fsw>.card:last-child{display:none}.fsw.full>.card:first-child{display:none}.fsw.full>.card:last-child{display:flex}
.alts.fs{display:flex;width:fit-content;max-width:100%}
.plats{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0;padding:0;list-style:none}
.plats li{font-size:12.5px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--soft)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 0;padding:0;list-style:none}
.tags li{font-size:12.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.vols{list-style:none;margin:10px 0 0;padding:0;font-size:14px;border-left:2px solid var(--c);padding-left:10px}
.vols li{margin:2px 0;display:flex;flex-wrap:wrap;gap:0 8px}
.vols b{font-weight:600}.vols span{color:var(--muted)}
.notes{margin:10px 0 0;font-size:15px;line-height:1.55;white-space:pre-line;max-width:65ch}
.empty-tl{padding:40px 0;color:var(--muted)}
.era-h{font:600 15px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 16px;display:flex;align-items:center;gap:12px}
.era-h::after{content:'';flex:1;height:1px;background:var(--line)}
.tl-list+.era-h{margin-top:14px}
.kind .role{font-style:normal;color:var(--muted);font-weight:500}
.badge.camp{text-transform:none;letter-spacing:0}
.item.spin .marker{background:var(--surface);color:var(--c);box-shadow:0 0 0 4px var(--bg),inset 0 0 0 2px var(--c)}
.item.spin .card{border-left-style:dashed}
.card.spin{border-left-style:dashed}
.par{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;min-width:0;align-items:start}.par>:not(.par-l){grid-column:span 2}.par-2>:not(.par-l),.par-4>:not(.par-l),.par-5>:nth-child(2),.par-5>:nth-child(3){grid-column:span 3}
.par-l{grid-column:1/-1;margin:2px 0 -2px;font:600 12px 'Barlow',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.par .card:not(.hasfill){flex-direction:column}.par .card:not(.hasfill) .media{flex:none;width:100%;align-self:stretch}.par .card:not(.hasfill) .media img{max-height:190px}.par .card.hasfill .media{flex-basis:96px}
.item.sub .marker{width:16px;height:16px;margin-top:9px;background:var(--surface);box-shadow:0 0 0 4px var(--bg),inset 0 0 0 2px var(--c)}
.item.sub .marker svg{display:none}
.item.sub .year{font-size:20px;color:var(--muted);padding-top:6px}
.subwrap{position:relative;padding-left:26px;min-width:0}
.subwrap::before{content:'';position:absolute;left:4px;top:-14px;width:16px;height:36px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:8px}
.subwrap .media{flex-basis:150px}
.subwrap .body h3{font-size:18px}
.media.fill{align-self:stretch;min-height:150px}
.media.fill img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:var(--fp,center)}
.media.fill.empty{min-height:130px}
.media.fill.sq,.media.fill.vt{align-self:stretch;min-height:0;aspect-ratio:1/1}
.media.fill.vt{aspect-ratio:3/4}

@media (max-width:440px){.card{flex-direction:column}.media{flex:none;width:100%;align-self:stretch}.media img{max-height:280px}.card.land .media img{max-height:240px}.media.fill{min-height:0;aspect-ratio:16/9}.media.fill img{max-height:none}.card.hasfill{flex-direction:row}.card.hasfill .media.sq,.card.hasfill .media.vt{flex:0 0 96px;width:auto;align-self:stretch}}
@media (prefers-reduced-motion:reduce){.media img{transition:none}}</style>

    if(!im||im.tagName!=='IMG'||!im.naturalWidth)return;
    var m=im.closest('.media');if(!m||m.dataset.or)return;
    var first=m.querySelector('img:not(.broken)');if(first!==im)return;
    m.dataset.or=1;
    /* las portadas siempre van al costado */
  }
  function setBg(m){if(!m)return;var on=m.querySelector('img.on:not(.broken)');if(on&&on.complete&&on.naturalWidth)m.style.setProperty('--bgimg','url("'+(on.currentSrc||on.src).replace(/"/g,'%22')+'")');}
  root.addEventListener('load',function(ev){orient(ev.target);var t=ev.target;if(t&&t.tagName==='IMG'&&t.classList.contains('on'))setBg(t.closest('.media'));},true);
  render();
})(JSON.parse(document.getElementById('tl-data').textContent));</script>
</body>
</html>
