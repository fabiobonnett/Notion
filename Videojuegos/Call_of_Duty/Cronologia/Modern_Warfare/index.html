  function findOrder(id){for(var i=0;i<orders.length;i++){if(orders[i].id===id)return orders[i];}return null;}
  var st={orderId:orders[0].id,filter:'',mark:{},alt:{},role:'',camp:false};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function ico(t){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+ICONS[t]+'"/></svg>';}
  function tp(e){return TYPES[e.type]?e.type:'other';}
  function res(s){
    s=String(s||'').trim(); if(!s) return '';
    var gh=s.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/(.+)$/i);
    if(gh) return 'https://raw.githubusercontent.com/'+gh[1]+'/'+gh[2]+'/'+gh[3];
    if(/^(https?:)?\/\//i.test(s)||/^data:/i.test(s)) return s;
    var b=String(D.imgBase||'').trim().replace(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:tree|blob)\//i,'https://raw.githubusercontent.com/$1/$2/');

  var EXT=['jpg','png','webp','jpeg','JPG','PNG','JPEG','WEBP'];

  function srcAttr(s){var u=res(s);return noExt(s)?' src="'+esc(u+'.'+EXT[0])+'" data-b="'+esc(u)+'" data-t="1"':' src="'+esc(u)+'"';}

  function pof(name,g){

  function rng(s,a,b){var m=s.match(/^(\d+)\s*[-–]\s*(\d+)$/);return m?b+' '+m[1]+'–'+m[2]:(/^\d+$/.test(s)?a+' '+s:s);}

  function item(e,gid,cands,ord,opt){

      media='<div class="media'+(e.fill?' fill'+({square:' sq',tall:' vt'}[e.fillShape]||''):'')+'"'+(e.fill&&fp?' style="--fp:'+fp+'"':'')+'>'+imgs.map(function(u,i){return '<img'+srcAttr(u)+' alt="'+esc(e.title)+(imgs.length>1?' – imagen '+(i+1):'')+'"'+(i===0?' class="on"':'')+'>';}).join('')+
        (imgs.length>1?'<button class="nav prev" type="button" aria-label="Imagen anterior">‹</button><button class="nav next" type="button" aria-label="Imagen siguiente">›</button><span class="count">1/'+imgs.length+'</span>':'')+'</div>';
    }
    var title=esc(e.title||'Sin título');

    var plats=(t==='game'&&e.platforms&&e.platforms.length)?'<ul class="plats" aria-label="Plataformas">'+e.platforms.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>':'';

      var n=String(v.nums||'').trim(),m=n.match(/^#?(\d+)\s*[-–]\s*#?(\d+)$/),s=n;
      if(m){var a=+m[1],b=+m[2],VU={cap:['capítulo','capítulos','Caps. '],tomo:['tomo','tomos','Tomos '],vol:['volumen','volúmenes','Vols. ']}[e.issuesUnit]||['número','números','#'];s=VU[2]+a+'–'+b+' ('+plural(b-a+1,VU[0],VU[1])+')';}
      else if(/^#?\d+$/.test(n))s='#'+n.replace('#','');
      return '<li><b>'+esc(v.name)+'</b>'+(s?'<span>'+esc(s)+'</span>':'')+'</li>';}).join('')+'</ul>':'';
    var sw=(cands&&cands.length>1)?'<div class="alts" role="group" aria-label="Versión">'+cands.map(function(x){return '<button type="button" data-g="'+esc(gid)+'" data-v="'+esc(x.id)+'" aria-pressed="'+(x.id===e.id)+'">'+esc(x.altLabel||x.title||'Versión')+'</button>';}).join('')+'</div>':'';
    var tags=(e.genres&&e.genres.length)?'<ul class="tags" aria-label="Géneros y etiquetas">'+e.genres.map(function(g){return '<li>'+esc(g)+'</li>';}).join('')+'</ul>':'';

      '<article class="card'+(spin?' spin':'')+(e.fill&&imgs.length?' hasfill':'')+'" style="--c:var(--'+t+')">'+media+'<div class="body">'+sw+
      '<p class="kind"><b>'+esc((t==='game'&&(e.gamePart||opt.parent))?(e.gamePart||'DLC'):(t==='comic'&&e.comicFormat)?e.comicFormat:(t==='film'&&e.avType)?e.avType:TYPES[t][0])+'</b>'+roleTxt+(e.marks||[]).filter(function(id){return MK[id];}).map(function(id){return '<em class="badge" style="--m:'+mcol(MK[id])+'">'+esc(MK[id].name)+'</em>';}).join('')+sub.map(function(x){return '<span>'+x+'</span>';}).join('')+'</p>'+
      '<h3>'+title+'</h3>'+(fx?'<p class="facts">'+esc(fx)+'</p>':'')+plats+vols+tags+notes+'</div></article>'};
  }
  function li(P,cls,body){return '<li class="item'+(P.spin?' spin':'')+cls+'" style="--c:var(--'+P.t+')">'+P.year+'<div class="spine"><span class="marker" title="'+TYPES[P.t][0]+'">'+ico(P.t)+'</span></div>'+body+'</li>';}
  function relOf(e,ord){var r=ord&&ord.rel&&ord.rel[e.id];if(r!==undefined)return r||'';return e.attach?'attach':e.parallel?'parallel':'';}
  function rowsHtml(xs,ord){

      if(L&&relOf(x.e,ord)==='parallel'&&!L.subs.length){L.par.push(x);return;}
      if(L&&relOf(x.e,ord)==='attach'){L.subs.push(x);return;}

      var m=R.m,P=item(m.e,m.g,m.c,ord),h;

        var cards=[P.card].concat(R.par.map(function(x){return item(x.e,x.g,x.c,ord,{inlineYear:true}).card;}));

      return h;}).join('');
  }
  function render(){
    var byId={}; (D.entries||[]).forEach(function(e){byId[e.id]=e;});
    var oh=(findOrder(st.orderId)||orders[0]).hide||{};
    var all=(D.entries||[]).map(function(e,i){var o={};for(var k in e)o[k]=e[k];o._i=i;return o;}).filter(function(e){return !oh[e.id];});
    var counts={};all.forEach(function(e){var t=tp(e);counts[t]=(counts[t]||0)+1;});
    var present=ORDER.filter(function(t){return counts[t];});
    if(st.filter&&!counts[st.filter]) st.filter='';
    var ord=findOrder(st.orderId)||orders[0];
    function isAlt(e){var p=e.altOf&&byId[e.altOf];return !!(p&&!p.altOf&&p.id!==e.id);}

    all.forEach(function(e){if(groups[e.id]&&!seen[e.id]){seen[e.id]=1;seq.push(e);}});
    function pass(e){
      if(st.filter&&tp(e)!==st.filter) return false;
      var sp=e.spinoff&&tp(e)==='game';
      if(st.role==='main'&&sp) return false;
      if(st.role==='spin'&&!sp) return false;

      for(var k in st.mark){var has=em.indexOf(k)>=0;if(st.mark[k]==='only'&&!has) return false;if(st.mark[k]==='hide'&&has) return false;}
      return true;}
    var shown=seq.map(function(p){
      if(ord.hide&&ord.hide[p.id]) return null;
      var c=groups[p.id].filter(pass);if(!c.length) return null;
      var cur=c.filter(function(x){return x.id===st.alt[p.id];})[0]||c[0];
      return {e:cur,g:p.id,c:c};}).filter(Boolean);
    var h='';
    if(D.title||D.subtitle||D.icon||all.length){
      var iv=String(D.icon||'').trim(),ih='';
      if(iv) ih=(/\.(png|jpe?g|gif|webp|svg|avif)(\?.*)?$/i.test(iv)||/^(https?:|data:|\/\/)/i.test(iv))?'<img class="tl-icon" src="'+esc(res(iv))+'" alt="">':'<span class="tl-icon tl-emoji" aria-hidden="true">'+esc(iv)+'</span>';
      h+='<header class="tl-head">'+(D.title||ih?'<h1>'+ih+(D.title?'<span>'+esc(D.title)+'</span>':'')+'</h1>':'')+(D.subtitle?'<p>'+esc(D.subtitle)+'</p>':'');
      if(all.length) h+='<p class="tl-sum">'+plural(all.length,'entrada','entradas')+(present.length>1?': '+present.map(function(t){return plural(counts[t],TYPES[t][1],TYPES[t][2]);}).join(', '):'')+'</p>';

    if(D.showFilters!==false&&present.length>1) c+='<div class="chips" role="group" aria-label="Filtrar por tipo"><button type="button" class="chip" data-f="" aria-pressed="'+(!st.filter)+'">Todo</button>'+present.map(function(t){return '<button type="button" class="chip" data-f="'+t+'" style="--c:var(--'+t+')" aria-pressed="'+(st.filter===t)+'">'+ico(t)+TYPES[t][3]+' <span>'+counts[t]+'</span></button>';}).join('')+'</div>';
    if(D.showFilters!==false){
      var usedM=MARKS.filter(function(m){return all.some(function(e){return (e.marks||[]).indexOf(m.id)>=0;});});
      if(usedM.length) c+='<div class="chips" role="group" aria-label="Filtrar por etiquetas">'+usedM.map(function(m){var s=st.mark[m.id]||'',tg=m.mode==='hide';return '<button type="button" class="chip mchip'+(s?' '+s:'')+'" data-m="'+esc(m.id)+'" style="--m:'+mcol(m)+'" aria-pressed="'+(!!s)+'" title="'+(tg?'Clic: ocultar estas entradas. Otro clic: volver a mostrarlas.':'Clic: ver solo estas. Otro clic: ocultarlas. Otro clic: quitar el filtro.')+'"><i></i>'+(s==='only'?'Solo ':s==='hide'?'Sin ':'')+esc(m.name)+'</button>';}).join('')+'</div>';
    }

      var nSp=all.filter(function(e){return e.spinoff&&tp(e)==='game';}).length,rc='';

      if(rc) c+='<div class="chips" role="group" aria-label="Filtrar por rol">'+rc+'</div>';

    if(c) h+='<div class="tl-controls">'+c+'</div>';

    root.innerHTML=h;
    [].forEach.call(root.querySelectorAll('.media img'),function(im){if(im.complete)orient(im);});
  }
  root.addEventListener('click',function(ev){
    var b=ev.target.closest('button'); if(!b) return;

    if(b.dataset.m){var mid=b.dataset.m,cur=st.mark[mid];if(!cur)st.mark[mid]='only';else if(cur==='only')st.mark[mid]='hide';else delete st.mark[mid];render();return;}

  });
  root.addEventListener('error',function(ev){

    var cn=m.querySelector('.count');if(cn)cn.textContent='1/'+ok.length;
    if(ok.length===1)[].forEach.call(m.querySelectorAll('.nav,.count'),function(n){n.remove();});
  },true);
  function orient(im){
    if(!im||im.tagName!=='IMG'||!im.naturalWidth)return;
    var m=im.closest('.media');if(!m||m.dataset.or)return;

  }
  root.addEventListener('load',function(ev){orient(ev.target);},true);
  render();
})(JSON.parse(document.getElementById('tl-data').textContent));</script>
