<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call of Duty: Black Ops 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="cv-style">
:root{
  --bg:#ffffff; --ink:#1d1e22; --muted:#6c707a; --line:#e3e4e8; --soft:#f2f3f5;
  --accent:#ffd23f; --accent-ink:#1d1e22; --danger:#d23b2c; --reader:#121316;
  --shadow:rgba(20,22,30,.28);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --ink:#ebebeb; --muted:#9a9ea6; --line:#2f3034; --soft:#242528;
    --shadow:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --ink:#ebebeb; --muted:#9a9ea6; --line:#2f3034; --soft:#242528;
  --shadow:rgba(0,0,0,.6); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.cv-noscroll{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

.cv-wrap{max-width:1120px;margin:0 auto;padding:24px 20px 48px}
.cv-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 24px;padding-bottom:18px;margin-bottom:24px;border-bottom:3px solid var(--ink)}
.cv-titleblock{min-width:0;flex:1 1 320px}
.cv-chip{display:inline-block;font:600 13px/1 'Barlow',sans-serif;padding:5px 8px 4px;border:1.5px solid var(--ink);border-radius:3px;margin-bottom:10px}
.cv-title{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:.92;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.cv-sub{margin:8px 0 0;color:var(--muted);font-size:16px;max-width:62ch}
.cv-count{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.cv-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.cv-seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--ink);border-radius:999px;padding:2px;gap:2px;isolation:isolate}
.cv-seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 6px) / 2);border-radius:999px;background:var(--accent);z-index:0;transition:transform .34s cubic-bezier(.34,1.32,.5,1);pointer-events:none}
.cv-seg[data-on="b"] .cv-seg-thumb{transform:translateX(calc(100% + 2px))}
.cv-seg button{position:relative;z-index:1;border:0;background:none;color:inherit;cursor:pointer;font:700 13px/1 'Barlow',sans-serif;padding:7px 12px 6px;border-radius:999px;letter-spacing:.02em;transition:color .25s}
.cv-seg button[aria-pressed="true"]{color:var(--accent-ink)}

.cv-btn{display:inline-flex;align-items:center;gap:6px;font:600 14px/1 'Barlow',sans-serif;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none}
.cv-btn:hover{border-color:var(--ink)}
.cv-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cv-primary:hover{border-color:var(--accent-ink)}
.cv-wide{width:100%;justify-content:center}
.cv-ibtn{width:36px;height:36px;display:inline-grid;place-items:center;border:0;border-radius:6px;background:transparent;color:inherit;cursor:pointer;text-decoration:none;flex:none}
.cv-ibtn:hover{background:rgba(127,127,127,.18)}
.cv-ibtn[aria-pressed="true"]{background:rgba(127,127,127,.26)}

.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 18px}
.cv-card{min-width:0}
.cv-coverbtn{position:relative;display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:3px;text-align:left}
.cv-cover{aspect-ratio:2/3;border-radius:3px;overflow:hidden;background:var(--soft);box-shadow:0 0 0 1px var(--line),0 8px 16px -10px var(--shadow);transition:box-shadow .15s}
.cv-coverbtn:hover .cv-cover,.cv-coverbtn:focus-visible .cv-cover{box-shadow:0 0 0 2px var(--ink),0 10px 20px -10px var(--shadow)}
.cv-cover img{width:100%;height:100%;object-fit:cover;display:block}
.cv-num{position:absolute;top:0;left:0;background:var(--accent);color:var(--accent-ink);font:800 18px/1 'Barlow Condensed',sans-serif;padding:6px 8px 4px;border-top-left-radius:3px;border-bottom-right-radius:4px;box-shadow:1px 1px 0 rgba(0,0,0,.28)}
.cv-meta{padding-top:9px}
.cv-ititle{font:600 14.5px/1.3 'Barlow',sans-serif;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv-note{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.cv-card.is-off .cv-cover{filter:grayscale(1);opacity:.45}

.cv-ph{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 12px;color:#fff;
  background:radial-gradient(rgba(255,255,255,.17) 1.1px,transparent 1.7px) 0 0/7px 7px,linear-gradient(165deg,hsl(var(--h) 52% 46%),hsl(calc(var(--h) + 35) 58% 24%))}
.cv-ph-t{font:800 clamp(20px,2.6vw,26px)/.95 'Barlow Condensed',sans-serif;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cv-ph-s{font:600 12px/1.25 'Barlow',sans-serif;margin-top:6px;opacity:.85}

.cv-empty{grid-column:1/-1;padding:28px 0;color:var(--muted)}
.cv-empty p{margin:0 0 14px;font-size:16px}

/* Lector */
.cv-reader{position:fixed;inset:0;z-index:50;background:var(--reader);color:#ececec;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cv-reader[hidden],.cv-layer[hidden]{display:none}
.cv-rbar{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:52px}
.cv-rtitle{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.cv-rtitle strong{font:800 20px/1 'Barlow Condensed',sans-serif;color:var(--accent)}
.cv-rtitle span{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cv-rtools{display:flex;align-items:center;gap:4px}
.cv-reader .cv-seg{border-color:#5a5c63;margin-right:4px}
.cv-reader .cv-seg button{color:#ececec}
.cv-reader .cv-seg button[aria-pressed="true"]{color:var(--accent-ink)}
.cv-stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y pinch-zoom;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cv-pages{display:flex;gap:0;align-items:center;justify-content:center;max-width:100%;max-height:100%}
.cv-pages.is-frame{width:100%;height:100%}
.cv-page{display:block;background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.55)}
.cv-ph{background:#e9e9ec}
.cv-spread{display:flex;align-items:center;justify-content:center}
.cv-spread.is-fade{animation:cvfade .24s ease}
@keyframes cvfade{from{opacity:0}to{opacity:1}}
.cv-scene{position:relative;flex:none;perspective:2400px;-webkit-perspective:2400px}
.cv-under,.cv-leaf{position:absolute}
.cv-under{overflow:hidden;background:#fff}
.cv-under>.cv-page,.cv-face>.cv-page{width:100%!important;height:100%!important;box-shadow:none}
.cv-leaf{z-index:2;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform}
.cv-face{position:absolute;inset:0;overflow:hidden;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 28px rgba(0,0,0,.4)}
.cv-face .cv-spread .cv-page{box-shadow:none}
.cv-back{transform:rotateY(180deg)}
.cv-shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
.cv-frame{width:100%;height:100%;border:0;background:#fff}
.cv-zone{position:absolute;top:0;bottom:0;width:30%;border:0;background:none;cursor:pointer;display:flex;align-items:center;padding:0 10px;color:#fff;opacity:0;transition:opacity .15s}
.cv-zone.prev{left:0;justify-content:flex-start}
.cv-zone.next{right:0;justify-content:flex-end}
.cv-zone:hover,.cv-zone:focus-visible{opacity:.75}
.cv-zone span{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55)}
.cv-stage.is-frame .cv-zone,.cv-stage.is-msg .cv-zone{display:none}
.cv-msg{max-width:440px;padding:24px;text-align:center}
.cv-msg p{margin:0 0 16px;color:#cfd0d4;font-size:16px}
.cv-msg .cv-url{font-size:13px;color:#9a9ea6;word-break:break-all}
.cv-msg .cv-btn{background:transparent;color:#ececec;border-color:#5a5c63;margin:4px}
.cv-msg .cv-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cv-rfoot{display:flex;gap:14px;align-items:center;padding:6px 16px 12px}
.cv-rfoot[hidden]{display:none}
.cv-scrub{flex:1;position:relative;height:36px;cursor:pointer;touch-action:none;outline:none;--p:0}
.cv-track{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:rgba(255,255,255,.22);transition:height .15s,margin .15s}
.cv-scrub:hover .cv-track,.cv-scrub.is-drag .cv-track{height:6px;margin-top:-3px}
.cv-fill{position:absolute;inset:0;border-radius:inherit;background:var(--accent);transform-origin:left center;transform:scaleX(var(--p))}
.cv-knob{position:absolute;top:50%;left:calc(var(--p) * 100%);width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.55);transition:transform .15s}
.cv-scrub:not(.is-drag) .cv-fill{transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.cv-scrub:not(.is-drag) .cv-knob{transition:left .38s cubic-bezier(.2,.8,.2,1),transform .15s}
.cv-scrub.is-drag .cv-knob{transform:scale(1.3)}
.cv-scrub:focus-visible .cv-knob{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
.cv-tip{position:absolute;bottom:calc(100% + 8px);left:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:#000;border:2px solid #f2f2f2;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none;z-index:5}
.cv-tip[hidden]{display:none}
.cv-tipimg{width:96px;height:144px;background:#2a2b30 center/cover no-repeat}
.cv-tipimg.is-wait{animation:cvpulse 1s ease-in-out infinite alternate}
@keyframes cvpulse{from{opacity:.55}to{opacity:1}}
.cv-tipnum{font:700 13px/1 'Barlow',sans-serif;color:#fff;padding:5px 8px 4px;font-variant-numeric:tabular-nums}
.cv-pcount{font:600 14px/1 'Barlow',sans-serif;color:#cfd0d4;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}

/* Capas: editor y código */
.cv-layer{position:fixed;inset:0;z-index:60}
.cv-scrim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.cv-panel{position:absolute;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.22);padding-top:env(safe-area-inset-top,0px)}
.cv-phead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.cv-phead h2{font:800 26px/1 'Barlow Condensed',sans-serif;margin:0}
.cv-pbody{overflow:auto;padding:0 18px 48px;flex:1}
.cv-sec{padding:18px 0;border-bottom:1px solid var(--line)}
.cv-sec:last-child{border-bottom:0}
.cv-sec h3{font:700 15px/1.2 'Barlow',sans-serif;margin:0 0 12px}
.cv-sechead{display:flex;justify-content:space-between;align-items:baseline}
.cv-muted{color:var(--muted);font-size:13.5px}
.cv-help{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:64ch}
.cv-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.cv-field>span{font-size:13px;font-weight:600;color:var(--muted)}
.cv-field small{color:var(--muted);font-size:12.5px}
.cv-layer input[type="text"],.cv-layer input[type="url"],.cv-layer select,.cv-layer textarea{font:15px/1.3 'Barlow',sans-serif;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.cv-layer textarea{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
.cv-layer input:focus,.cv-layer select:focus,.cv-layer textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(255,210,63,.55)}
.cv-row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.cv-row2.cv-lang{grid-template-columns:2fr 1fr}
.cv-issue{border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px}
.cv-issue[open]{border-color:var(--ink)}
.cv-issue summary{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;cursor:pointer;list-style:none}
.cv-issue summary::-webkit-details-marker{display:none}
.cv-ihnum{font:800 16px/1 'Barlow Condensed',sans-serif;background:var(--accent);color:var(--accent-ink);padding:4px 6px 3px;border-radius:3px;flex:none}
.cv-ihtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cv-ihflags{font-size:12px;color:var(--muted);flex:none}
.cv-ibtn.is-armed{width:auto;padding:0 10px;color:var(--danger);font-weight:700;font-size:13px}
.cv-igrid{display:grid;grid-template-columns:76px 1fr 1fr;gap:0 10px;padding:6px 10px 2px}
.cv-span3{grid-column:1/-1}
.cv-check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:14px;cursor:pointer}
.cv-check input{margin-top:3px;accent-color:var(--ink)}
.cv-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.cv-err{color:var(--danger);font-size:13.5px;margin:8px 0 0;min-height:1em}

.cv-modalbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(660px,calc(100% - 24px));max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--bg);color:var(--ink);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.cv-tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line)}
.cv-tabs button{border:0;background:none;cursor:pointer;font:600 14.5px/1 'Barlow',sans-serif;padding:12px 4px 10px;margin-right:14px;border-bottom:2.5px solid transparent;color:var(--muted)}
.cv-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cv-mbody{overflow:auto;padding:16px 18px 18px}

.cv-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px)}
.cv-toast.is-on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .cv-wrap{padding:18px 14px 40px}
  .cv-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:20px 12px}
  .cv-igrid{grid-template-columns:1fr}
  .cv-row2{grid-template-columns:1fr}
  .cv-rtitle span{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>

/* ---- Escena de paso de página ---- */
function buildScene(dir,np){
  var box=stageBox(),cl=pagesToShow(),cur=R.vc.get(vkey(cl));
  if(!box||!cur||!cur.v)return null;
  var C=cur.v,tl=viewAt(np),T=getViewNow(tl,C.sizes);
  function el(cls){var d=document.createElement('div');d.className=cls;return d;}
  function place(d,x,y,w,h){d.style.left=Math.round(x)+'px';d.style.top=Math.round(y)+'px';d.style.width=w+'px';d.style.height=h+'px';}
  function dims(v){return {w:v.sizes.reduce(function(a,z){return a+z.w;},0),h:Math.max.apply(null,v.sizes.map(function(z){return z.h;}))};}
  function group(v){var g=el('cv-spread');v.els.forEach(function(c){g.appendChild(c);});return g;}
  var root=el('cv-scene');root.style.width=box.sw+'px';root.style.height=box.sh+'px';
  var leaf=el('cv-leaf'),front=el('cv-face'),fsh=el('cv-shade'),ush=el('cv-shade');
  var sc={dir:dir,np:np,root:root,leaf:leaf,fsh:fsh,ush:ush,p:0,tsz:T.sizes,csz:C.sizes};
  if(cl.length===2&&tl.length===2){
    sc.kind='spread';
    var d=dims(C),x0=(box.sw-d.w)/2,y0=(box.sh-d.h)/2,wl=C.sizes[0].w,wr=C.sizes[1].w,h=d.h,spine=x0+wl;
    var uL=el('cv-under'),uR=el('cv-under'),back=el('cv-face cv-back'),bsh=el('cv-shade');
    if(dir>0){
      uL.appendChild(C.els[0]);uR.appendChild(T.els[1]);
      front.appendChild(C.els[1]);back.appendChild(T.els[0]);
      place(leaf,spine,y0,wr,h);leaf.style.transformOrigin='left center';
      sc.w=wr;uR.appendChild(ush);
    }else{
      uL.appendChild(T.els[0]);uR.appendChild(C.els[1]);
      front.appendChild(C.els[0]);back.appendChild(T.els[1]);
      place(leaf,x0,y0,wl,h);leaf.style.transformOrigin='right center';
      sc.w=wl;uL.appendChild(ush);
    }
    place(uL,x0,y0,wl,h);place(uR,spine,y0,wr,h);
    back.appendChild(bsh);sc.bsh=bsh;
    front.appendChild(fsh);leaf.appendChild(front);leaf.appendChild(back);
    root.appendChild(uL);root.appendChild(uR);
  }else{
    sc.kind='single';
    var lv=dir>0?C:T,uv=dir>0?T:C,du=dims(uv),dl=dims(lv);
    var u=el('cv-under');u.style.background='transparent';
    u.appendChild(group(uv));u.appendChild(ush);
    place(u,(box.sw-du.w)/2,(box.sh-du.h)/2,du.w,du.h);
    front.appendChild(group(lv));front.appendChild(fsh);leaf.appendChild(front);
    place(leaf,(box.sw-dl.w)/2,(box.sh-dl.h)/2,dl.w,dl.h);leaf.style.transformOrigin='left center';
    root.appendChild(u);sc.w=dl.w;
  }
  root.appendChild(leaf);
  var pc=$('#cv-pages');pc.innerHTML='';pc.appendChild(root);
  return sc;
}
function setP(sc,p){
  p=Math.min(1,Math.max(0,p));sc.p=p;
  var a;
  if(sc.kind==='spread'){a=Math.acos(1-2*p)*180/Math.PI;if(sc.dir>0)a=-a;}
  else a=-(sc.dir>0?Math.acos(1-p):Math.acos(p))*180/Math.PI;
  sc.leaf.style.transform='rotateY('+a.toFixed(2)+'deg)';
  var k=Math.abs(Math.sin(a*Math.PI/180));
  sc.fsh.style.opacity=(k*0.32).toFixed(3);
  if(sc.bsh)sc.bsh.style.opacity=(k*0.32).toFixed(3);
  var cover=(sc.kind==='single'&&sc.dir<0)?p:1-p;
  sc.ush.style.opacity=(cover*0.38).toFixed(3);
}
function dragProgress(sc,dx){
  var span=sc.kind==='spread'?2*sc.w:sc.w;
  return (sc.dir>0?-dx:dx)/span;
}
function tween(sc,to,dur,inout,done){
  var from=sc.p,t0=null;
  function ease(x){return inout?(x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2):1-Math.pow(1-x,3);}
  function step(t){
    if(R.anim!==sc)return;
    if(t0==null)t0=t;
    var x=Math.min(1,(t-t0)/dur);
    setP(sc,from+(to-from)*ease(x));
    if(x<1)sc.raf=requestAnimationFrame(step);else done();
  }
  sc.raf=requestAnimationFrame(step);
}
function endScene(sc,done){
  if(R.anim!==sc)return;
  R.anim=null;
  if(done)R.page=sc.np;
  updateCounter();
  staticNow(pagesToShow(),done?sc.tsz:sc.csz);
  var q=R.queued;R.queued=0;
  if(q)setTimeout(function(){turn(q);},0);
}
function stopAnim(){
  if(R.anim&&R.anim.raf)cancelAnimationFrame(R.anim.raf);
  R.anim=null;R.queued=0;
}
function bump(dir){
  var sp=$('#cv-pages .cv-spread');
  if(!sp||reduced()||!sp.animate)return;
  sp.animate([{transform:'translateX(0)'},{transform:'translateX('+(-dir*16)+'px)'},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'});
}
/* Pasar página con botón, teclado o toque */
function turn(dir){
  if(!R.doc)return;
  if(R.anim){R.queued=dir;return;}
  var np=targetPage(dir);if(!np){bump(dir);return;}
  var cur=R.vc.get(vkey(pagesToShow()));
  if(reduced()||!cur||!cur.v){R.page=np;renderPages();return;}
  var pend={pending:true};R.anim=pend;
  getView(viewAt(np)).then(function(){
    if(R.anim!==pend)return;
    R.anim=null;
    var sc=buildScene(dir,np);
    if(!sc){R.page=np;renderPages();return;}
    R.anim=sc;setP(sc,0);
    tween(sc,1,560,true,function(){endScene(sc,true);});
  },function(){
    if(R.anim===pend)R.anim=null;
    R.page=np;renderPages();
  });
}
function go(dir){turn(dir);}
/* Saltar a una página (barra inferior) */
function jumpTo(pg){
  if(!R.doc)return;
  pg=Math.min(R.n,Math.max(1,Math.round(pg)));
  var same=vkey(viewAt(pg))===vkey(pagesToShow())&&!R.anim;
  stopAnim();
  R.page=pg;updateCounter();
  if(!same)showView(pagesToShow(),true);
}

/* ---- Arrastre con el dedo ---- */
var swiped=false;
function bindStage(){
  var stage=$('#cv-stage'),g=null;
  stage.addEventListener('pointerdown',function(e){
    if(!R.doc||R.anim||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;
    if(window.visualViewport&&window.visualViewport.scale>1.05)return;
    if(!$('#cv-pages .cv-spread'))return;
    g={id:e.pointerId,x0:e.clientX,y0:e.clientY,on:false,pts:[]};
  });
  stage.addEventListener('pointermove',function(e){
    if(!g||e.pointerId!==g.id)return;
    var dx=e.clientX-g.x0,dy=e.clientY-g.y0;
    if(!g.on){
      if(Math.abs(dy)>24&&Math.abs(dy)>Math.abs(dx)){g=null;return;}
      if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy)*1.2)return;
      if(R.anim){g=null;return;}
      g.on=true;R.drag=true;g.dir=dx<0?1:-1;
      try{stage.setPointerCapture(e.pointerId);}catch(_){}
      g.np=targetPage(g.dir);
      if(g.np&&!reduced())g.sc=buildScene(g.dir,g.np);
      if(g.sc){R.anim=g.sc;setP(g.sc,0);}
      else{g.edge=$('#cv-pages .cv-spread');if(g.edge)g.edge.style.transition='none';}
    }
    if(e.cancelable)e.preventDefault();
    g.pts.push({x:e.clientX,t:e.timeStamp});if(g.pts.length>6)g.pts.shift();
    if(g.sc){if(R.anim===g.sc)setP(g.sc,dragProgress(g.sc,dx));}
    else if(g.edge)g.edge.style.transform='translateX('+(dx*(g.np?0.6:0.22)).toFixed(1)+'px)';
  });
  function up(e){
    if(!g||e.pointerId!==g.id)return;
    var gg=g;g=null;R.drag=false;
    if(!gg.on)return;
    swiped=true;setTimeout(function(){swiped=false;},350);
    var a=gg.pts[0],b=gg.pts[gg.pts.length-1],v=0;
    if(a&&b&&b.t>a.t)v=(b.x-a.x)/(b.t-a.t);
    var cancel=e.type==='pointercancel';
    if(gg.sc){
      var sc=gg.sc;if(R.anim!==sc)return;
      var vt=sc.dir>0?-v:v;
      var done=!cancel&&(vt>0.45||(sc.p>0.33&&vt>-0.25));
      var rem=done?1-sc.p:sc.p;
      tween(sc,done?1:0,Math.max(150,Math.min(420,rem*560)),false,function(){endScene(sc,done);});
    }else{
      var dx=(b?b.x:gg.x0)-gg.x0;
      if(gg.np&&!cancel&&Math.abs(dx)>60){R.page=gg.np;renderPages();return;}
      if(gg.edge){gg.edge.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';gg.edge.style.transform='';}
    }
  }
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
}

/* ---- Barra inferior con miniaturas ---- */
function bindScrub(){
  var s=$('#cv-scrub'),tip=$('#cv-tip'),drag=null;
  function at(x){
    var r=s.getBoundingClientRect(),f=r.width?Math.min(1,Math.max(0,(x-r.left)/r.width)):0;
    return {f:f,pg:Math.round(1+f*(R.n-1)),r:r};
  }
  function showTip(a){
    if(!R.doc)return;
    tip.hidden=false;
    var tw=tip.offsetWidth||100,x=a.f*a.r.width;
    x=Math.max(tw/2-4,Math.min(a.r.width-tw/2+4,x));
    tip.style.left=x+'px';
    $('#cv-tipnum').textContent=a.pg+' / '+R.n;
    setThumb(a.pg);
  }
  s.addEventListener('pointerdown',function(e){
    if(!R.doc||(e.pointerType==='mouse'&&e.button!==0))return;
    e.preventDefault();
    try{s.setPointerCapture(e.pointerId);}catch(_){}
    drag={id:e.pointerId};s.classList.add('is-drag');
    var a=at(e.clientX);s.style.setProperty('--p',a.f);showTip(a);drag.pg=a.pg;
  });
  s.addEventListener('pointermove',function(e){
    if(!R.doc)return;
    var a=at(e.clientX);
    if(drag&&e.pointerId===drag.id){s.style.setProperty('--p',a.f);showTip(a);drag.pg=a.pg;}
    else if(!drag&&e.pointerType==='mouse')showTip(a);
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    var pg=drag.pg;drag=null;s.classList.remove('is-drag');tip.hidden=true;
    if(e.type==='pointercancel'){updateCounter();return;}
    jumpTo(pg);
    if(pg===R.page)updateCounter();
  }
  s.addEventListener('pointerup',end);
  s.addEventListener('pointercancel',end);
  s.addEventListener('pointerleave',function(e){if(!drag&&e.pointerType==='mouse')tip.hidden=true;});
}
function setThumb(pg){
  var box=$('#cv-tipimg');if(!box)return;
  box.setAttribute('data-pg',pg);
  if(R.th.has(pg)){
    var u=R.th.get(pg);
    box.style.backgroundImage=u?'url('+u+')':'none';
    box.classList.remove('is-wait');
  }else{
    box.classList.add('is-wait');
    R.thWant=pg;pumpThumbs();
  }
}
function pumpThumbs(){
  if(R.thBusy||!R.doc||!R.open)return;
  var n=(R.thWant&&!R.th.has(R.thWant))?R.thWant:0;
  if(!n){for(var i=1;i<=R.n&&i<=500;i++){if(!R.th.has(i)){n=i;break;}}}
  if(!n)return;
  R.thBusy=true;
  var tok=R.token,doc=R.doc;
  doc.getPage(n).then(function(p){
    var v0=p.getViewport({scale:1}),v=p.getViewport({scale:Math.min(2.2,300/v0.height)});
    var c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);
    return p.render({canvasContext:c.getContext('2d'),viewport:v}).promise.then(function(){return c;});
  }).then(function(c){
    if(tok!==R.token)return;
    var u='';try{u=c.toDataURL('image/jpeg',0.72);}catch(_){}
    c.width=0;c.height=0;R.th.set(n,u);
  },function(){if(tok===R.token)R.th.set(n,'');}).then(function(){
    if(tok!==R.token)return;
    R.thBusy=false;
    var box=$('#cv-tipimg');
    if(box&&+box.getAttribute('data-pg')===n)setThumb(n);
    var urgent=R.thWant&&!R.th.has(R.thWant);
    setTimeout(pumpThumbs,urgent?0:90);
  });
}

var openIssues={};
function field(label,path,val,ph,help,cls){
  return '<label class="cv-field'+(cls?' '+cls:'')+'"><span>'+esc(label)+'</span><input type="text" data-path="'+path+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+' spellcheck="false" autocomplete="off">'+(help?'<small>'+esc(help)+'</small>':'')+'</label>';
}
function select(label,path,opts,val){
  var o=opts.map(function(x){return Array.isArray(x)?x:[x,x];});
  if(val&&!o.some(function(x){return x[0]===val;}))o.unshift([val,val]);
  return '<label class="cv-field"><span>'+esc(label)+'</span><select data-path="'+path+'">'+o.map(function(x){return '<option value="'+esc(x[0])+'"'+(x[0]===val?' selected':'')+'>'+esc(x[1])+'</option>';}).join('')+'</select></label>';
}
function flags(it){var f=[];if(it.pdf_a)f.push(langCode('a'));if(it.pdf_b)f.push(langCode('b'));return f.length?f.join(' / '):'sin PDF';}
function issuesHTML(){
  if(!state.issues.length)return '<p class="cv-help">Añade el primer número con el botón de abajo o pega varios a la vez.</p>';

    var p='issues.'+i+'.';
    return '<details class="cv-issue" data-i="'+i+'"'+(openIssues[it.id]?' open':'')+' data-id="'+esc(it.id)+'">'+

        '<button type="button" class="cv-ibtn" data-act="del" data-i="'+i+'" aria-label="Eliminar número">'+ic('trash',16)+'</button>'+

  }).join('');
}

function setPath(path,v){
  var parts=path.split('.'),o=state;
  for(var k=0;k<parts.length-1;k++){o=o[parts[k]];if(o==null)return;}
  o[parts[parts.length-1]]=v;
}
var rTimer=null;
function scheduleRender(){clearTimeout(rTimer);rTimer=setTimeout(function(){renderHeader();renderGrid();},350);}
function bulkAdd(){
  var ta=$('#cv-bulk');if(!ta)return;
  var lines=ta.value.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  if(!lines.length){toast('Escribe al menos una línea.');return;}
  lines.forEach(function(l){
    var f=l.split(/\t|;/).map(function(x){return x.trim();});
    state.issues.push({id:uid(),number:f[0]||'',title_a:f[1]||'',title_b:f[2]||'',pdf_a:f[3]||'',pdf_b:f[4]||'',cover:f[5]||''});
  });
  ta.value='';renderIssues();saveDraft();renderHeader();renderGrid();
  toast(lines.length===1?'Añadido 1 número':'Añadidos '+lines.length+' números');
}

/* ---------- Código: exportar e importar ---------- */
var codeTab='export';
function buildExport(ro){
  var payload=JSON.parse(JSON.stringify(state));
  if(ro)payload.readonly=true;
  var json=JSON.stringify(payload).replace(/</g,'\\u003c');
  var css=document.getElementById('cv-style').textContent;
  var js=document.getElementById('cv-main').textContent;
  var C='<'+'/script>';
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
    '<title>'+esc(state.series.title||'Visor de cómics')+'</title>\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
    '<link href="'+FONT_HREF+'" rel="stylesheet">\n'+
    '<style id="cv-style">'+css+'</style>\n</head>\n<body>\n<div id="cv-root"></div>\n'+
    '<script src="'+PDFJS_SRC+'">'+C+'\n'+
    '<script type="application/json" id="comic-data">'+json+C+'\n'+
    '<script id="cv-main">'+js+C+'\n</body>\n</html>\n';
}
function parseImport(text){
  text=String(text||'').trim();if(!text)return null;
  try{var o=JSON.parse(text);if(o&&(o.series||o.issues))return o;}catch(e){}
  try{
    var doc=new DOMParser().parseFromString(text,'text/html');
    var el=doc.getElementById('comic-data');
    if(el){var o2=JSON.parse(el.textContent);if(o2&&(o2.series||o2.issues))return o2;}
  }catch(e){}
  return null;
}
function openModal(){codeTab='export';renderModal();elModal.hidden=false;document.body.classList.add('cv-noscroll');}
function closeModal(){elModal.hidden=true;elModal.innerHTML='';if(!R.open&&elDrawer.hidden)document.body.classList.remove('cv-noscroll');}
function renderModal(){
  var body=codeTab==='export'?
    '<p class="cv-help">Copia el código y guárdalo como archivo .html en tu hosting (por ejemplo GitHub Pages). Luego pega el enlace de ese archivo en Notion con /embed. Los PDF tienen que estar en rutas públicas.</p>'+
    '<label class="cv-check"><input type="checkbox" id="cv-ro"'+(lastRO?' checked':'')+'><span>Solo lectura: oculta Editar y Código en la versión publicada. Para volver a verlos, añade #edit al final del enlace.</span></label>'+
    '<textarea id="cv-out" rows="9" readonly spellcheck="false" aria-label="Código del visor"></textarea>'+
    '<div class="cv-actions"><button type="button" class="cv-btn cv-primary" data-act="copy">Copiar al portapapeles</button></div>'
  :
    '<p class="cv-help">Pega el código HTML de un visor exportado, o solo sus datos en JSON. La serie actual se reemplaza por la importada.</p>'+
    '<textarea id="cv-in" rows="9" spellcheck="false" placeholder="&lt;!DOCTYPE html&gt;…" aria-label="Código para importar"></textarea>'+
    '<p class="cv-err" id="cv-ierr"></p>'+
    '<div class="cv-actions"><button type="button" class="cv-btn" data-act="paste">Pegar del portapapeles</button><button type="button" class="cv-btn cv-primary" data-act="import">Importar</button></div>';
  elModal.innerHTML='<div class="cv-scrim" data-act="mclose"></div>'+
    '<div class="cv-modalbox" role="dialog" aria-modal="true" aria-labelledby="cv-mtitle">'+
      '<div class="cv-phead"><h2 id="cv-mtitle">Código del visor</h2><button type="button" class="cv-ibtn" data-act="mclose" aria-label="Cerrar">'+ic('close',20)+'</button></div>'+
      '<div class="cv-tabs" role="tablist">'+
        '<button type="button" role="tab" data-tab="export" aria-selected="'+(codeTab==='export')+'">Exportar</button>'+
        '<button type="button" role="tab" data-tab="import" aria-selected="'+(codeTab==='import')+'">Importar</button>'+
      '</div>'+
      '<div class="cv-mbody">'+body+'</div>'+
    '</div>';
  if(codeTab==='export')$('#cv-out').value=buildExport(lastRO);
  else $('#cv-in').focus();
}
var lastRO=false;
function copyText(text,ta){
  function fallback(){
    try{ta.focus();ta.select();var ok=document.execCommand('copy');toast(ok?'Código copiado':'Selecciona el texto y cópialo con Ctrl+C');}
    catch(e){toast('Selecciona el texto y cópialo con Ctrl+C');}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast('Código copiado');},fallback);
  }else fallback();
}
function doImport(){
  var ta=$('#cv-in'),err=$('#cv-ierr');
  var o=parseImport(ta.value);
  if(!o){err.textContent='No encontré datos del visor en ese texto. Pega el HTML completo que genera Exportar.';return;}
  state=normalize(o);openIssues={};resolvedCovers={};
  lang=state.settings.defaultLang;
  applyTheme();saveDraft();renderHeader();renderGrid();closeModal();
  toast('Serie importada: '+(state.series.title||'sin título'));
}

/* ---------- Idioma ---------- */
var langTo=null,langTimer=null;
function setLang(l){
  if(l!=='a'&&l!=='b')return;
  if(l===(langTo||lang))return;
  langTo=l;
  document.querySelectorAll('.cv-seg').forEach(function(sg){
    sg.setAttribute('data-on',l);
    sg.querySelectorAll('button[data-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-lang')===l));});
  });
  clearTimeout(langTimer);
  langTimer=setTimeout(function(){
    var x=langTo;langTo=null;if(!x||x===lang)return;
    lang=x;renderHeader();renderGrid();
    if(R.open)loadReader();
  },reduced()?0:320);
}

/* ---------- Toast ---------- */
var tTimer=null;
function toast(msg){elToast.textContent=msg;elToast.classList.add('is-on');clearTimeout(tTimer);tTimer=setTimeout(function(){elToast.classList.remove('is-on');},2400);}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-lang],[data-open],[data-tab]');if(!t)return;
  if(t.hasAttribute('data-lang')){setLang(t.getAttribute('data-lang'));return;}
  if(t.hasAttribute('data-open')){openReader(+t.getAttribute('data-open'));return;}
  if(t.hasAttribute('data-tab')){codeTab=t.getAttribute('data-tab');renderModal();return;}
  var a=t.getAttribute('data-act'),i=+t.getAttribute('data-i');
  if(t.closest('summary'))e.preventDefault();
  switch(a){
    case 'edit':openDrawer();break;
    case 'code':openModal();break;
    case 'dclose':closeDrawer();break;
    case 'mclose':closeModal();break;
    case 'rclose':closeReader();break;
    case 'prev':if(swiped)return;turn(-1);break;
    case 'next':if(swiped)return;turn(1);break;
    case 'rother':setLang(other(lang));break;
    case 'riframe':setStageMode('frame');$('#cv-pages').innerHTML='<iframe class="cv-frame" src="'+esc(R.url)+'" title="PDF"></iframe>';break;
    case 'spread':R.spread=!R.spread;t.setAttribute('aria-pressed',R.spread);stopAnim();resetViews();renderPages();break;
    case 'fs':
      if(document.fullscreenElement)document.exitFullscreen();
      else if(elReader.requestFullscreen)elReader.requestFullscreen().catch(function(){toast('Pantalla completa no disponible aquí');});
      break;
    case 'add':
      var last=state.issues[state.issues.length-1];
      var nn=last&&/^\d+$/.test(last.number)?String(+last.number+1):String(state.issues.length+1);
      var it={id:uid(),number:nn,title_a:'',title_b:'',pdf_a:'',pdf_b:'',cover:''};
      state.issues.push(it);openIssues[it.id]=true;renderIssues();saveDraft();renderHeader();renderGrid();
      var d=$('#cv-issues details:last-of-type');if(d){d.scrollIntoView({block:'nearest'});var inp=$('input[data-path$=".title_a"]',d);if(inp)inp.focus();}
      break;
    case 'up':case 'down':
      var j=a==='up'?i-1:i+1;if(j<0||j>=state.issues.length)break;
      var tmp=state.issues[i];state.issues[i]=state.issues[j];state.issues[j]=tmp;
      renderIssues();saveDraft();renderGrid();
      var mv=$('#cv-issues [data-act="'+a+'"][data-i="'+j+'"]');if(mv&&!mv.disabled)mv.focus();
      break;
    case 'del':
      if(!t.classList.contains('is-armed')){
        t.classList.add('is-armed');t.textContent='¿Eliminar?';
        setTimeout(function(){if(t.isConnected&&t.classList.contains('is-armed')){t.classList.remove('is-armed');t.innerHTML=ic('trash',16);}},3000);
        break;
      }
      state.issues.splice(i,1);renderIssues();saveDraft();renderHeader();renderGrid();toast('Número eliminado');
      break;
    case 'bulk':bulkAdd();break;
    case 'copy':copyText($('#cv-out').value,$('#cv-out'));break;
    case 'paste':
      if(navigator.clipboard&&navigator.clipboard.readText){
        navigator.clipboard.readText().then(function(x){$('#cv-in').value=x;},function(){$('#cv-ierr').textContent='El navegador no deja leer el portapapeles aquí. Pega con Ctrl+V.';$('#cv-in').focus();});
      }else{$('#cv-ierr').textContent='Pega con Ctrl+V.';$('#cv-in').focus();}
      break;
    case 'import':doImport();break;
  }
});
document.addEventListener('input',function(e){
  var p=e.target.getAttribute&&e.target.getAttribute('data-path');if(!p)return;
  setPath(p,e.target.value);
  if(p==='settings.theme')applyTheme();
  var m=p.match(/^issues\.(\d+)\./);
  if(m){
    var d=elDrawer.querySelector('details[data-i="'+m[1]+'"]'),it=state.issues[+m[1]];
    if(d&&it){$('.cv-ihnum',d).textContent=numLabel(it)||'#';$('.cv-ihtitle',d).textContent=titleFor(it,'a')||'Sin título';$('.cv-ihflags',d).textContent=flags(it);}
  }
  if(p==='settings.defaultLang')lang=e.target.value;
  if(p.indexOf('settings.langs.')===0)renderIssues();
  saveDraft();scheduleRender();
});
document.addEventListener('change',function(e){
  if(e.target.id==='cv-ro'){lastRO=e.target.checked;var o=$('#cv-out');if(o)o.value=buildExport(lastRO);}
});
document.addEventListener('toggle',function(e){
  var d=e.target;if(!d.classList||!d.classList.contains('cv-issue'))return;
  var id=d.getAttribute('data-id');if(d.open)openIssues[id]=true;else delete openIssues[id];
},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!elModal.hidden){closeModal();return;}
    if(!elDrawer.hidden){closeDrawer();return;}
    if(R.open&&!document.fullscreenElement){closeReader();return;}
  }
  if(!R.open||!elModal.hidden||!elDrawer.hidden)return;
  var tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&tag!=='button'&&tag!=='a')){e.preventDefault();turn(1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();turn(-1);}
  else if(e.key==='Home'){e.preventDefault();jumpTo(1);}
  else if(e.key==='End'){e.preventDefault();jumpTo(R.n);}
});
var rzTimer=null;
window.addEventListener('resize',function(){clearTimeout(rzTimer);rzTimer=setTimeout(function(){if(R.open&&R.doc&&!R.drag){stopAnim();resetViews();renderPages();}},180);});
window.addEventListener('hashchange',function(){renderHeader();renderGrid();});

/* ---------- Inicio ---------- */
applyTheme();renderHeader();renderGrid();
})();
</script>
</body>
</html>
